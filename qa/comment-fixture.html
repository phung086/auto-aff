<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>LinkDesk · Kiểm thử mô phỏng Facebook</title><style>body{font:16px sans-serif;padding:24px}#editor{padding:14px;border:1px solid #aaa;min-height:60px;white-space:pre-wrap}button{margin:20px 10px 20px 0;padding:12px}pre{white-space:pre-wrap}</style></head><body><h1>Mô phỏng ô bình luận · dữ liệu thử</h1><p>Không kết nối Facebook, không gửi bên ngoài.</p><section id="thread"><article role="article"><p>Bài mô phỏng: cần công cụ AI hỗ trợ lập trình.</p><div><div id="editor" role="textbox" contenteditable="true" aria-label="Viết bình luận"></div><button id="send" aria-label="Đăng bình luận">Đăng bình luận</button></div></article></section><button id="run">Chạy adapter bình luận</button><pre id="result">Chưa chạy.</pre><script type="module">
import { prepareAutoComment, submitAutoComment } from '../extension/browser.mjs?qa=3';
import { AFFILIATE_URL, DISCLOSURE } from '../extension/model.mjs';
const text = `Mô phỏng bình luận đúng nhu cầu.\n\n${AFFILIATE_URL}\n\n${DISCLOSURE}`;
let clicks = 0;
document.getElementById('send').addEventListener('click', () => { clicks++; const article = document.createElement('article'); article.setAttribute('role','article'); article.textContent = document.getElementById('editor').innerText; document.getElementById('thread').append(article); document.getElementById('editor').textContent = ''; });
window.chrome = { tabs: { create: async () => ({id:1}), get: async () => ({status:'complete'}), remove: async () => {} }, scripting: { executeScript: async args => [{result:await args.func(...(args.args||[]))}] } };
document.getElementById('run').addEventListener('click', async () => { try { const prepared = await prepareAutoComment(location.href,text); const result = await submitAutoComment(prepared.tabId,text,location.href); document.getElementById('result').textContent = JSON.stringify({result,clicks,exactLink:document.getElementById('thread').innerText.includes(AFFILIATE_URL)},null,2); } catch(error) { document.getElementById('result').textContent = error.message; } });
</script></body></html>
